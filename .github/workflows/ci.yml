name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Content fidelity (content/pages VERBATIM vs dist)
        run: npm run verify-content

  e2e:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      # wrangler dev citește .dev.vars (gitignored): chei Turnstile de test + MAIL_MODE=log — nimic nu pleacă din CI
      - run: cp .dev.vars.example .dev.vars && printf '
MAIL_MODE=log
' >> .dev.vars
      - name: Playwright (Chromium + WebKit, desktop + mobil) pe wrangler dev
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
